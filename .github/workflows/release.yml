name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_git_aur:
        description: "Publish scalpel-poe-git to AUR"
        required: true
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  release-win:
    if: ${{ github.event_name == 'push' }}
    # Pinned: windows-latest rotated to an image where node-gyp couldn't locate
    # Visual Studio to rebuild native dependencies. windows-2022 has the working toolchain.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Everything downstream derives the version from package.json, never from the
      # tag: `Extract version` feeds the dist/v<version>/ globs, and pack-asar writes
      # that same value into manifest.json -- which is what the updater compares
      # (updater.ts: `if (runningVersion === remote.version) return`). So a tag that
      # disagrees with package.json publishes a fully GREEN release whose assets and
      # manifest carry the OTHER version, and every client silently no-ops. Fail loud.
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION but package.json has $PKG_VERSION"
            exit 1
          fi
          echo "Releasing v$PKG_VERSION"
      - name: Install Python setuptools (needed by node-gyp)
        run: pip install setuptools
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Pack ASAR
        run: node scripts/pack-asar.js
      - name: Build installer (no publish - we handle that separately)
        run: npx electron-builder --win --x64 --publish never
      - name: Extract version
        id: version
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >>$GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, '-exp') }}
          # Without this a glob that matches nothing is silently skipped, so a missing
          # manifest.json still publishes a green "latest" release -- and the updater
          # bails at `release.assets.find(a => a.name === 'manifest.json')`, leaving
          # every client with no upgrade path and no error anywhere.
          fail_on_unmatched_files: true
          files: |
            dist/v${{ steps.version.outputs.version }}/app.asar
            dist/v${{ steps.version.outputs.version }}/app.asar.unpacked.zip
            dist/v${{ steps.version.outputs.version }}/manifest.json
            dist/Scalpel-Setup.exe
  release-linux:
    if: ${{ github.event_name == 'push' }}
    needs: release-win
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Linux native build deps
        # uiohook-napi and electron-overlay-window's X11 backends link against
        # the X11/xcb dev headers. libfuse2 is the AppImage Type 2 runtime
        # dependency used by electron-builder's appimagetool. Building on
        # 22.04 (glibc 2.35) is intentional: the resulting AppImage runs on
        # most distros from 2022+; building on 24.04 (glibc 2.39) would
        # restrict to 2024+ hosts.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              libxcb1-dev libxtst-dev libxss-dev libxkbfile-dev \
              libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
              libxcursor-dev libxi-dev libxkbcommon-dev libfuse2
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Build AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Extract version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >>$GITHUB_OUTPUT
      - name: Append AppImage to GitHub Release
        # The Windows job creates the release with notes; this appends the
        # AppImage artifact. softprops/action-gh-release upserts on tag.
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, '-exp') }}
          fail_on_unmatched_files: true
          files: |
            dist/Scalpel.AppImage
  publish-aur:
    needs: release-linux
    # Fork: AUR publishing needs upstream-only secrets, so gate it to the upstream
    # repo. Without this it fails on every fork release (red run + email).
    if: ${{ github.repository == 'scalpelpoe/scalpel' && github.event_name == 'push' && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, '-exp') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed \
              base-devel \
              curl \
              git \
              pacman-contrib \
              sudo
          useradd --create-home builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
      - uses: actions/checkout@v5
      - name: Update AUR package metadata
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          VERSION="${GITHUB_REF_NAME#v}" sudo --preserve-env=GITHUB_WORKSPACE,VERSION -u builder \
              bash -lc 'cd "$GITHUB_WORKSPACE" && scripts/update-aur-packages.sh --version "$VERSION"'
      - name: Publish scalpel-poe-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: scalpel-poe-bin
          pkgbuild: packaging/aur/scalpel-poe-bin/PKGBUILD
          assets: |
            packaging/aur/scalpel-poe-bin/.SRCINFO
            packaging/aur/scalpel-poe-bin/scalpel-poe.sh
            packaging/aur/scalpel-poe-bin/scalpel-poe.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "chore: update scalpel-poe-bin to ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
      - name: Publish scalpel-poe to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: scalpel-poe
          pkgbuild: packaging/aur/scalpel-poe/PKGBUILD
          assets: |
            packaging/aur/scalpel-poe/.SRCINFO
            packaging/aur/scalpel-poe/scalpel-poe.sh
            packaging/aur/scalpel-poe/scalpel-poe.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "chore: update scalpel-poe to ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
      - name: Open pull request for updated AUR metadata
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: bot/update-aur-packages
          delete-branch: true
          add-paths: |
            packaging/aur/scalpel-poe-bin/PKGBUILD
            packaging/aur/scalpel-poe-bin/.SRCINFO
            packaging/aur/scalpel-poe/PKGBUILD
            packaging/aur/scalpel-poe/.SRCINFO
          commit-message: "chore(aur): update packages to ${{ github.ref_name }}"
          title: "chore(aur): update packages to ${{ github.ref_name }}"
          body: |
            Automated follow-up to the ${{ github.ref_name }} release.

            This synchronizes the release-based AUR package recipes in `main`
            with the metadata published to the AUR.
  publish-aur-git:
    if: ${{ github.repository == 'scalpelpoe/scalpel' && github.event_name == 'workflow_dispatch' && inputs.publish_git_aur }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish scalpel-poe-git to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: scalpel-poe-git
          pkgbuild: packaging/aur/scalpel-poe-git/PKGBUILD
          assets: |
            packaging/aur/scalpel-poe-git/.SRCINFO
            packaging/aur/scalpel-poe-git/scalpel-poe.sh
            packaging/aur/scalpel-poe-git/scalpel-poe.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "chore: publish scalpel-poe-git"
          ssh_keyscan_types: rsa,ecdsa,ed25519
