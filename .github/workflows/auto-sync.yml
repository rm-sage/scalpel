name: Upstream sync

# Keeps this fork current with scalpelpoe/scalpel automatically.
#
# Once a day (or on manual dispatch) this merges upstream/main into the fork's
# main, re-derives the fork version, verifies with the SAME gate as CI plus the
# fork-invariant test, and -- only if everything is green -- pushes a release tag
# so the app auto-updates. If the merge conflicts, or verification fails, it writes
# the reason to the run summary and fails the run (so GitHub emails the owner) and
# ships nothing. The fork-invariant test (src/shared/fork-invariants.test.ts) is
# what guarantees a merge can never silently revert the update-feed repoint or drop
# the macro and still publish: that would turn the suite red and block the tag push.
#
# One-time setup (see FORK-SETUP.md):
#   - Enable Actions on the fork (GitHub disables them on forks by default).
#   - Add a repo secret RELEASE_PAT: a fine-grained PAT with contents:write on
#     this repo. Tags pushed with the default GITHUB_TOKEN do NOT trigger
#     release.yml, so the publish step uses the PAT instead.

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    # Pinned: windows-latest rotated to an image where node-gyp can't locate
    # Visual Studio to rebuild active-win. windows-2022 has the working toolchain.
    # (ci.yml and release.yml were already pinned; this one was missed, so every
    # scheduled sync failed at `npm ci` -> postinstall -> electron-rebuild.)
    runs-on: windows-2022
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # PAT so the tag push at the end triggers release.yml (a push made with
          # the default GITHUB_TOKEN does not start further workflow runs). Falls
          # back to GITHUB_TOKEN when RELEASE_PAT isn't set yet, so a scheduled run
          # before the one-time setup no-ops cleanly instead of failing at checkout
          # (it'll still merge/verify; only the auto-ship tag-trigger needs the PAT).
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python setuptools (needed by node-gyp)
        run: pip install setuptools

      - name: Configure git identity
        shell: bash
        run: |
          # MUST be the owner's @users.noreply address, not their real one: GitHub's
          # "block pushes that expose my email" setting rejects a push whose commits
          # carry the private address (GH007), which silently killed every scheduled
          # sync at the final `git push` -- after a clean merge and a green verify.
          git config user.name "scalpel-fork-bot"
          git config user.email "10146713+rm-sage@users.noreply.github.com"

      - name: Fetch upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/scalpelpoe/scalpel.git 2>/dev/null || true
          git fetch upstream main --tags

      - name: Check for new upstream work
        id: check
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already current with upstream/main; nothing to sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.skip == 'false'
        id: merge
        shell: bash
        run: |
          UPSTREAM_VER="$(git show upstream/main:package.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          echo "upstream_ver=$UPSTREAM_VER" >> "$GITHUB_OUTPUT"
          echo "Merging upstream/main ($UPSTREAM_VER) into main..."

          set +e
          git merge --no-ff --no-commit upstream/main
          MERGE_RC=$?
          set -e

          if [ $MERGE_RC -ne 0 ]; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            # A version-line clash on package.json/package-lock.json is expected on
            # every upstream version bump and is resolved deterministically below
            # (the version is re-derived, never merged). Any OTHER conflicted file
            # is a real merge that needs a human.
            OTHER="$(printf '%s\n' "$CONFLICTS" | grep -vE '^(package\.json|package-lock\.json)$' || true)"
            if [ -n "$OTHER" ]; then
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              {
                echo "conflicts<<EOF"
                printf '%s\n' "$CONFLICTS"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              echo "Real conflicts outside the version files; opening an issue instead of shipping."
              exit 0
            fi
            # Version-only conflict: drop both sides of the version line; the next
            # step rewrites package.json's version from the upstream baseline.
            git checkout --theirs -- package.json package-lock.json 2>/dev/null || true
            git add package.json package-lock.json
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: Apply fork version and commit
        if: steps.check.outputs.skip == 'false' && steps.merge.outputs.conflict == 'false'
        id: version
        shell: bash
        run: |
          FORK_VER="$(node scripts/set-fork-version.js "${{ steps.merge.outputs.upstream_ver }}")"
          echo "Fork version: $FORK_VER"
          git add -A
          git commit -m "chore(fork): sync upstream ${{ steps.merge.outputs.upstream_ver }} -> $FORK_VER"
          echo "fork_ver=$FORK_VER" >> "$GITHUB_OUTPUT"

      - name: Verify (same gate as CI + fork invariants)
        id: verify
        if: steps.check.outputs.skip == 'false' && steps.merge.outputs.conflict == 'false'
        shell: bash
        run: |
          npm ci
          # Keep this list in step with ci.yml's `check` job -- the step name promises
          # parity, and anything missing here can auto-ship a build that ci.yml then
          # reds AFTER the release is already public.
          npm run validate:premium-mods -- --require-verified
          npm run build:i18n --if-present
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test
          npm run build

      - name: Publish (push main + release tag)
        if: steps.check.outputs.skip == 'false' && steps.merge.outputs.conflict == 'false'
        shell: bash
        run: |
          V="v${{ steps.version.outputs.fork_ver }}"
          # Order matters. If main is pushed first and the TAG push then fails, the
          # next run finds upstream/main already an ancestor -> skip=true -> the job
          # reports SUCCESS and ships nothing, forever: main sits on a version that no
          # future run will ever tag. Pushing the tag first inverts the failure into a
          # harmless retry (a tag with no main advance just re-releases the same tree).
          git tag "$V"
          git push origin "$V"
          git push origin main
          # Belt and braces: prove both refs actually landed rather than trusting exit codes.
          git ls-remote --tags origin "$V" | grep -q . || {
            echo "::error::tag $V is not on origin after a successful push"
            exit 1
          }
          echo "Pushed $V -> release.yml will build and publish."

      # Notifications use the run summary + a failed run (GitHub emails the repo
      # owner on workflow failure) instead of gh issue create -- Issues are
      # disabled on this fork and the default token is read-only, so creating an
      # issue isn't reliably available. The summary needs no token/permissions.
      - name: Report merge conflict (no auto-ship)
        if: steps.merge.outputs.conflict == 'true'
        shell: bash
        run: |
          {
            echo "## ⚠️ Upstream sync needs a manual merge"
            echo ""
            echo "Hit a real merge conflict against upstream \`${{ steps.merge.outputs.upstream_ver }}\` and shipped nothing. \`origin/main\` is untouched."
            echo ""
            echo "**Conflicting files:**"
            echo '```'
            echo "${{ steps.merge.outputs.conflicts }}"
            echo '```'
            echo ""
            echo "Resolve via a PR (local installs need Node 22, so push a branch and let CI verify), then ff \`main\` + tag to ship. See FORK-SETUP.md."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream sync needs a manual merge (${{ steps.merge.outputs.upstream_ver }}) — see the run summary."
          exit 1

      # Two distinct failures, two distinct reports. These used to be one step whose
      # only condition was `failure() && conflict != 'true'`, so a PUBLISH failure
      # rendered the VERIFY summary -- which is how a `git push` rejection (GH007,
      # private-email block) spent five days reported as "typecheck / lint / test /
      # build failed", pointing at the wrong subsystem entirely. Gate each on
      # steps.verify.outcome so the summary can never describe the wrong step again.
      - name: Report verification failure (no auto-ship)
        if: failure() && steps.merge.outputs.conflict != 'true' && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## ❌ Upstream sync failed verification"
            echo ""
            echo "Merged upstream cleanly but a check (premium-mods / typecheck / lint / format / test / build) failed, so nothing was published. \`origin/main\` is untouched."
            echo ""
            echo "Usually means upstream changed something the macro, the repoint, or the fork-invariant test depends on. Fix on a branch and re-run."
          } >> "$GITHUB_STEP_SUMMARY"

      # Catch-all. Gating the two reports above on steps.verify.outcome means a
      # failure BEFORE verification ever ran (checkout, setup-node, the upstream
      # fetch, the merge step itself) leaves outcome == 'skipped' and would otherwise
      # produce a red run with an empty summary -- silence that reads exactly like
      # the silence of a healthy run. Never let a failure go undescribed.
      - name: Report pre-verification failure (no auto-ship)
        if: failure() && steps.merge.outputs.conflict != 'true' && steps.verify.outcome == 'skipped'
        shell: bash
        run: |
          {
            echo "## ❌ Upstream sync failed before verification"
            echo ""
            echo "The job died before the verify gate ran, so this is infrastructure, not code: checkout, setup-node, the \`pip install setuptools\` step, the upstream fetch, or the merge step itself."
            echo ""
            echo "Nothing was built and nothing was published. \`origin/main\` is untouched. Open the failing step's log directly."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report publish failure (verified but not shipped)
        if: failure() && steps.merge.outputs.conflict != 'true' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          {
            echo "## ❌ Upstream sync verified but could NOT publish"
            echo ""
            echo "The merge was clean and the full gate passed — the failure is in the **Publish** step, not the code. Read that step's log; do not go looking for a broken test."
            echo ""
            echo "Known causes:"
            echo "- \`GH007: Your push would publish a private email address\` — the committer email must be the owner's \`@users.noreply.github.com\` address."
            echo "- \`refusing to allow a Personal Access Token to create or update workflow\` — \`RELEASE_PAT\` needs **Workflows: Read and write**, not just \`contents: write\`."
            echo "- A non-fast-forward push, if something else landed on \`main\` after checkout."
            echo ""
            echo "The tag is pushed BEFORE \`main\`, so \`origin/main\` may or may not have advanced — check \`git log origin/main\` and the tag list before re-running."
          } >> "$GITHUB_STEP_SUMMARY"
